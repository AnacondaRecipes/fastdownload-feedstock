{% set name = "fastdownload" %}
{% set version = "0.0.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fastdownload-{{ version }}.tar.gz
  sha256: 7ae6176e2e397de8a25764d4be1b304c9bbe815e7cd9ff36856f7cba9874b3f7

build:
  skip: true  # [py<36]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools >=64
  run:
    - python
    - fastprogress
    - fastcore >=1.3.26

test:
  imports:
    - fastdownload
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/fastai/fastdownload/tree/master/
  summary: A general purpose data downloading library.
  description: |
    If you have datasets or other archives that you want
    to make available to your users, and ensure they always
    have the latest versions and that they are downloaded
    correctly, fastdownload can help.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/fastai/fastdownload
  doc_url: https://fastdownload.fast.ai/

extra:
  recipe-maintainers:
    - giswqs
